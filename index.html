<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>地月系科学小动画</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Noto Sans", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f1c3f 0%, #02030a 55%, #000 100%);
      color: #f8fbff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      padding: 2.5rem 1.5rem 3rem;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    canvas {
      width: min(90vw, 520px);
      height: min(90vw, 520px);
      border-radius: 50%;
      background: radial-gradient(circle at center, #031028 0%, #020924 65%, #01030f 100%);
      box-shadow: 0 0 18px rgba(0, 153, 255, 0.35);
    }

    .panel {
      width: min(90vw, 520px);
      background: rgba(4, 9, 22, 0.7);
      border: 1px solid rgba(110, 170, 255, 0.35);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      display: grid;
      gap: 0.9rem;
      backdrop-filter: blur(6px);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      font-size: 0.95rem;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
    }

    input[type="range"] {
      width: 220px;
      accent-color: #3ac6ff;
    }

    button {
      padding: 0.55rem 1.3rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #2bc0ff, #845cf7);
      color: #041229;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(59, 142, 255, 0.2);
    }

    p {
      margin: 0;
      line-height: 1.6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      font-size: 0.9rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      display: inline-block;
    }

    .sun { background: radial-gradient(circle, #fff4a0 0%, #ff9800 70%, #e95b00 100%); }
    .earth { background: radial-gradient(circle, #a6e1ff 0%, #1d8fff 65%, #0c3d73 100%); }
    .moon { background: radial-gradient(circle, #d7d7d7 0%, #9e9e9e 65%, #4b4b4b 100%); }

    footer {
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>地月系科学小动画</h1>
  <canvas id="space" width="520" height="520" aria-label="地月系运动演示"></canvas>

  <section class="panel">
    <div class="controls">
      <label>
        公转速度
        <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1" />
      </label>
      <button id="toggle">暂停</button>
    </div>
    <p>
      这个小动画使用简化的圆形轨道演示太阳、地球和月球的相对运动。拖动滑块可以加快或减慢公转速度，点击按钮可以暂停或继续观察。
    </p>
    <div class="legend">
      <span><span class="dot sun"></span>太阳（质量最大，几乎不动）</span>
      <span><span class="dot earth"></span>地球（绕太阳公转）</span>
      <span><span class="dot moon"></span>月球（绕地球公转）</span>
    </div>
  </section>

  <footer>比例和速度均为示意，便于理解而非真实比例。</footer>

  <script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    const speedInput = document.getElementById('speed');
    const toggleBtn = document.getElementById('toggle');

    const center = { x: canvas.width / 2, y: canvas.height / 2 };
    const orbitRadius = 180;
    const moonOrbitRadius = 44;

    let running = true;
    let earthAngle = 0;
    let moonAngle = 0;
    let lastTime = performance.now();
    let speedFactor = parseFloat(speedInput.value);

    function drawOrbit(radius, color, lineDash = []) {
      ctx.beginPath();
      ctx.setLineDash(lineDash);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawBody(x, y, radius, gradientStops) {
      const gradient = ctx.createRadialGradient(x - radius / 3, y - radius / 3, radius * 0.2, x, y, radius);
      gradientStops.forEach(([stop, color]) => gradient.addColorStop(stop, color));
      ctx.beginPath();
      ctx.fillStyle = gradient;
      ctx.shadowColor = gradientStops[gradientStops.length - 1][1];
      ctx.shadowBlur = radius * 0.6;
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function render(deltaTime) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制星空背景
      ctx.fillStyle = '#01040d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawStars();

      // 轨道
      drawOrbit(orbitRadius, 'rgba(58, 198, 255, 0.3)');

      const earthX = center.x + orbitRadius * Math.cos(earthAngle);
      const earthY = center.y + orbitRadius * Math.sin(earthAngle);

      // 月球轨道跟随地球
      ctx.save();
      ctx.translate(earthX, earthY);
      drawOrbit(moonOrbitRadius, 'rgba(255, 255, 255, 0.35)', [4, 6]);
      ctx.restore();

      // 天体
      drawBody(center.x, center.y, 30, [
        [0, '#fff4a0'],
        [0.4, '#ffb347'],
        [1, '#ff6b00']
      ]);

      drawBody(earthX, earthY, 14, [
        [0, '#d1f4ff'],
        [0.5, '#1d8fff'],
        [1, '#0b4178']
      ]);

      const moonX = earthX + moonOrbitRadius * Math.cos(moonAngle);
      const moonY = earthY + moonOrbitRadius * Math.sin(moonAngle);
      drawBody(moonX, moonY, 6, [
        [0, '#ffffff'],
        [0.5, '#bfbfbf'],
        [1, '#6f6f6f']
      ]);

      // 标注线
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.lineTo(earthX, earthY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 信息文本
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.font = '15px "Segoe UI", sans-serif';
      ctx.fillText('地球距太阳 ≈ 1 AU（天文单位，示意）', 28, canvas.height - 46);
      ctx.fillText('月球距地球 ≈ 384,400 km（示意）', 56, canvas.height - 24);
    }

    const starPositions = Array.from({ length: 130 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.4 + 0.4,
      twinkleOffset: Math.random() * Math.PI * 2
    }));

    function drawStars() {
      const now = performance.now() / 1000;
      starPositions.forEach(star => {
        const twinkle = (Math.sin(now * 2 + star.twinkleOffset) + 1) / 2;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, ${0.35 + twinkle * 0.45})`;
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function update(timestamp) {
      if (!running) {
        lastTime = timestamp;
        requestAnimationFrame(update);
        return;
      }

      const delta = (timestamp - lastTime) / 1000; // 秒
      lastTime = timestamp;

      const earthSpeed = 0.6 * speedFactor; // 弧度/秒
      const moonSpeed = 3.2 * speedFactor;

      earthAngle = (earthAngle + earthSpeed * delta) % (Math.PI * 2);
      moonAngle = (moonAngle + moonSpeed * delta) % (Math.PI * 2);

      render(delta);
      requestAnimationFrame(update);
    }

    speedInput.addEventListener('input', () => {
      speedFactor = parseFloat(speedInput.value);
    });

    toggleBtn.addEventListener('click', () => {
      running = !running;
      toggleBtn.textContent = running ? '暂停' : '继续';
    });

    render(0);
    requestAnimationFrame(update);
  </script>
</body>
</html>
