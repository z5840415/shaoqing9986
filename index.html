<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Snake Game</title>
<style>
body { font-family: sans-serif; text-align: center; }
canvas { background: #000; display: block; margin: 0 auto; }
#controls { margin-top: 10px; }
button { margin: 0 5px; }
</style>
</head>
<body>
<h1>Snake Game</h1>
<canvas id="game" width="400" height="400"></canvas>
<div id="score">Score: 0</div>
<div id="controls">
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const size = 20; // grid cell size
let snake, dir, food, score, gameLoop, running = false;

function init(){
    snake = [{x:10, y:10}];
    dir = {x:0, y:0};
    placeFood();
    score = 0;
    updateScore();
}

function placeFood(){
    food = {
        x: Math.floor(Math.random() * (canvas.width / size)),
        y: Math.floor(Math.random() * (canvas.height / size))
    };
}

function updateScore(){
    document.getElementById('score').textContent = 'Score: ' + score;
}

function draw(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'red';
    ctx.fillRect(food.x * size, food.y * size, size, size);

    ctx.fillStyle = 'lime';
    snake.forEach(seg => ctx.fillRect(seg.x * size, seg.y * size, size - 1, size - 1));
}

function step(){
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.y < 0 || head.x >= canvas.width / size || head.y >= canvas.height / size || snake.some(s => s.x === head.x && s.y === head.y)) {
        stop();
        return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score++;
        updateScore();
        placeFood();
    } else {
        snake.pop();
    }
    draw();
}

function start(){
    if (!running) {
        running = true;
        gameLoop = setInterval(step, 100);
    }
}

function stop(){
    running = false;
    clearInterval(gameLoop);
}

function pause(){
    stop();
}

function restart(){
    stop();
    init();
    start();
}

document.getElementById('start').addEventListener('click', start);
document.getElementById('pause').addEventListener('click', pause);
document.getElementById('restart').addEventListener('click', restart);

document.addEventListener('keydown', e => {
    switch (e.key) {
        case 'ArrowUp': if (dir.y === 0) dir = {x:0,y:-1}; break;
        case 'ArrowDown': if (dir.y === 0) dir = {x:0,y:1}; break;
        case 'ArrowLeft': if (dir.x === 0) dir = {x:-1,y:0}; break;
        case 'ArrowRight': if (dir.x === 0) dir = {x:1,y:0}; break;
    }
});

// initialize game state
restart();
</script>
</body>
</html>
